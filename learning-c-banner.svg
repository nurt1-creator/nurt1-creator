      <stop offset="0%" stop-color="#101827"/>
      <stop offset="38%" stop-color="#142B52"/>
      <stop offset="72%" stop-color="#1D4384"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="1"/>
      <stop offset="22%" stop-color="#0D1117" stop-opacity="0.92"/>
      <stop offset="58%" stop-color="#0D1117" stop-opacity="0.30"/>
